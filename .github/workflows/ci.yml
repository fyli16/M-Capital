name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-worker
            extras: "[dev]"
          - service: api-gateway
            extras: "[dev]"
          - service: performance-worker
            extras: "[dev]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install shared + service
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/aegis_shared
          pip install -e "services/${{ matrix.service }}${{ matrix.extras }}"
      - name: Lint
        run: ruff check "services/${{ matrix.service }}"
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  contracts:
    name: Contracts export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e packages/aegis_shared
      - run: python packages/aegis_shared/scripts/export_schemas.py

  eval:
    name: Agent eval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install -e packages/aegis_shared
          pip install -e "services/agent-worker[dev]"
      - name: Run golden eval (offline, fake LLM)
        working-directory: services/agent-worker
        run: python -m app.eval

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - working-directory: web
        run: |
          npm ci || npm install
          npm run typecheck

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.5" }
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, agent-worker, performance-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
