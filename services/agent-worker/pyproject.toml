[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-worker"
version = "0.1.0"
description = "M Capital agent-worker: LangGraph multi-agent investment research orchestration."
requires-python = ">=3.11"
# NOTE: `aegis-shared` is a local monorepo package. Install it first:
#   pip install -e packages/aegis_shared
#   pip install -e services/agent-worker
dependencies = [
    "langgraph>=0.2.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]
live = ["yfinance>=0.2.40", "requests>=2.31", "vaderSentiment>=3.3"]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
