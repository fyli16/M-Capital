[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-api-gateway"
version = "0.1.0"
description = "M Capital API gateway: FastAPI REST + auth + enqueue + SSE."
requires-python = ">=3.11"
# NOTE: install the shared package first:  pip install -e packages/aegis_shared
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
